name: Metrics
on:
  schedule: [{ cron: "0 0 * * *" }]
  workflow_dispatch:
  push: { branches: ["main", "master"] }

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          # --- core ---
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: metrics.vongola.svg
          template: terminal
          base: header, repositories, metadata
          config_timezone: Europe/Paris

          # --- languages ---
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_colors: github
          plugin_languages_details: percentage

          # --- contribution calendar (isometric) ---
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # --- recent activity ---
          plugin_activity: yes
          plugin_activity_limit: 4
          plugin_activity_days: 14
          plugin_activity_filter: all

          # --- stargazers over time ---
          plugin_stargazers: yes
          plugin_stargazers_charts: yes
          plugin_stargazers_charts_type: graph

          # --- restrained Dying Will ember (no glow, no emoji) ---
          extras_css: |
            pre { background: #0b0b0d !important; color: #cfcfd4 !important; }
            .terminal, .window, pre { border-color: #242428 !important; }
            .title { color: #8a8a90 !important; }
            .banner, footer { color: #6f6a70 !important; }
            .ps1-path { color: #ff5a1f !important; }      /* user@host -> ember */
            .ps1-location { color: #8a8a90 !important; }   /* ~ -> grey */
            strong, b { color: #ededf0 !important; }
            .isocalendar svg {
              filter: grayscale(1) sepia(.85) hue-rotate(-18deg)
                      saturate(2.3) brightness(.62) contrast(1.08) opacity(.95) !important;
            }
